name: Błąd Kino
description: Zgłoś problem, który można odtworzyć.
title: "[Błąd]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Nie publikuj haseł, tokenów, danych konta ani prywatnego adresu serwera."
  - type: input
    id: version
    attributes:
      label: Wersja Kino
      placeholder: "Nazwa wydania lub identyfikator commita"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Model TV i wersja Androida
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Jak odtworzyć problem?
      description: Opisz kroki, oczekiwane zachowanie i rzeczywisty wynik.
    validations:
      required: true
  - type: textarea
    id: playback
    attributes:
      label: Informacje o odtwarzaniu, jeśli dotyczy
      description: Kodeki wideo/audio, bitrate, wybrany limit, Ethernet/Wi-Fi, wersja Emby i czy odbywa się transkodowanie. Bez danych połączenia.
  - type: textarea
    id: evidence
    attributes:
      label: Zrzuty lub logi po usunięciu prywatnych danych
